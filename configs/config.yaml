# Reference configuration for documentation/training workflows. The Streamlit app currently uses constants and does not load this file.
app:
  name: "Plant Doctor AI"
  confidence_threshold: 0.60

image:
  allowed_extensions:
    - jpg
    - jpeg
    - png
  image_size: 224

model:
  architecture: "efficientnet_b0"
  weights_path: "artifacts/models/model_v1.pt"

data:
  root_dir: "data"
